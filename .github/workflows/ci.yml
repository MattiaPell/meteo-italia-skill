name: CI

on:
  push:
    paths:
      - "mcp/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: mcp

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
